<div *ngIf="currentAddress">
  <p>Results for address: {{currentAddress.address}}</p>
</div>
<ng-container *ngFor="let chart of chartList">
  <div class="my-2">
    <app-chart [chartModel]="chart"></app-chart>
  </div>
</ng-container>

<div class="text-right my-4">
  <button
    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded"
    (click)="downloadWeatherData()"
  >
    Download JSON
  </button>
</div>
